<script type="module">

 if(path==='webgl'){renderer.render(scene,cam);renderer.getContext().finish();renderer.getContext().readPixels(0,0,1,1,renderer.getContext().RGBA,renderer.getContext().UNSIGNED_BYTE,new Uint8Array(4));}

}catch(e){out.error=String(e&&e.stack||e).slice(0,600)}
