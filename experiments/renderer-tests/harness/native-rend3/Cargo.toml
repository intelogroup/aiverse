[package]
name = "r3-shot"
version = "0.1.0"
edition = "2021"
[dependencies]
rend3 = "0.3.0"
rend3-routine = "0.3.0"
rend3-gltf = "0.3.0"
wgpu = "0.12"
glam = "0.20"
pollster = "0.3"
image = { version = "0.24", default-features = false, features = ["png"] }
image23 = { package = "image", version = "0.23", default-features = false, features = ["jpeg","png"] }
serde_json = "1"
[profile.release]
opt-level = 3
[patch.crates-io]
wgpu-hal = { path = "vendor/wgpu-hal" }
