[package]
name = "native-shot"
version = "0.1.0"
edition = "2021"
[dependencies]
wgpu = "24"
gltf = { version = "1", default-features = false, features = ["utils","import"] }
image = { version = "0.25", default-features = false, features = ["jpeg","png"] }
pollster = "0.4"
glam = "0.29"
bytemuck = { version = "1", features = ["derive"] }
serde_json = "1"
[profile.release]
opt-level = 3
