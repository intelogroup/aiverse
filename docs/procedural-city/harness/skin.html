<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { clone } from "three/addons/utils/SkeletonUtils.js";
const q=new URLSearchParams(location.search); const body=q.get("body")||"cast-bodyblock";
const gltf=await new GLTFLoader().loadAsync(`/assets/${body}.glb`);
let tris=0,meshes=0,bones=0; gltf.scene.traverse(o=>{if(o.isMesh){meshes++;const g=o.geometry;tris+=(g.index?g.index.count:g.attributes.position.count)/3;} if(o.isBone)bones++;});
const walk=gltf.animations.find(a=>a.name==="Walk")||gltf.animations[0];
const renderer=new THREE.WebGLRenderer({antialias:false}); renderer.setSize(320,240); document.body.appendChild(renderer.domElement);
const gl=renderer.getContext(); const dbg=gl.getExtension("WEBGL_debug_renderer_info");
const out={body,meshes,tris:Math.round(tris),bones,clip:walk?.name,gpu:dbg?gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL):"?",results:[]};
async function bench(n,frames=90){
  const scene=new THREE.Scene(); scene.add(new THREE.HemisphereLight(0xffffff,0x444444,2));
  const cam=new THREE.PerspectiveCamera(45,320/240,0.1,500); cam.position.set(0,40,60); cam.lookAt(0,0,0);
  const mixers=[]; const side=Math.ceil(Math.sqrt(n));
  for(let i=0;i<n;i++){const o=clone(gltf.scene); o.position.set((i%side-side/2)*1.6,0,(Math.floor(i/side)-side/2)*1.6); scene.add(o);
    const m=new THREE.AnimationMixer(o); const a=m.clipAction(walk); a.time=Math.random()*walk.duration; a.play(); mixers.push(m);}
  renderer.render(scene,cam); // warmup/compile
  const mx=[],rd=[]; let calls=0,trisR=0;
  for(let f=0;f<frames;f++){
    const t0=performance.now(); for(const m of mixers)m.update(1/60);
    const t1=performance.now(); renderer.render(scene,cam); gl.finish&&0; const t2=performance.now();
    if(f>=15){mx.push(t1-t0);rd.push(t2-t1);} calls=renderer.info.render.calls; trisR=renderer.info.render.triangles;
    await new Promise(r=>requestAnimationFrame(r));
  }
  const mean=a=>a.reduce((x,y)=>x+y,0)/a.length;
  scene.traverse(o=>{if(o.isSkinnedMesh)o.skeleton.dispose?.();});
  return {n,mixerMs:+mean(mx).toFixed(2),renderSubmitMs:+mean(rd).toFixed(2),drawCalls:calls,tris:Math.round(trisR)};
}
for(const n of (q.get("ns")||"32,100,300").split(",").map(Number)) out.results.push(await bench(n));
window.__out=out;
</script>
