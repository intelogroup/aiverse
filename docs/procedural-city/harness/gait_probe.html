<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#dfe6ea}canvas{display:block}</style></head><body>
<!-- Gait filmstrip (2026-11-07): copy to apps/console/, serve with vite, open /gait_probe.html?body=summer|remy&mode=before|after&v=1.3 ; seven phases side view, red line = floor, label = lowest skinned vertex per frame. -->
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/examples/jsm/loaders/GLTFLoader.js";
import { clone as skClone } from "three/examples/jsm/utils/SkeletonUtils.js";
import { contactPoints, soleClearance, clipMinClearance, groundingOffset, rootMotionDelta } from "/src/features/world/grounding.ts";
import { gaitTargets, cycleRateFor } from "/src/features/world/gait.ts";
import { verticalExcess } from "/src/features/world/locomotion.ts";
import { BODY_SUMMER, BODY_REMY } from "/src/features/world/bodies.ts";
const q = new URLSearchParams(location.search);
const body = q.get("body") === "remy" ? BODY_REMY : BODY_SUMMER, mode = q.get("mode") ?? "after", v = Number(q.get("v") ?? 1.3), N = 7;
function strip(ab) { const dv = new DataView(ab); const jl = dv.getUint32(12, true); const json = JSON.parse(new TextDecoder().decode(new Uint8Array(ab, 20, jl)));
  delete json.images; delete json.textures; delete json.samplers; for (const k of ["extensionsUsed", "extensionsRequired"]) if (json[k]) json[k] = json[k].filter((e) => !/texture|basisu|webp/i.test(e));
  const kill = (o) => { if (o && typeof o === "object") for (const k of Object.keys(o)) { if (/Texture$/.test(k)) delete o[k]; else kill(o[k]); } }; kill(json.materials);
  let js = new TextEncoder().encode(JSON.stringify(json)); const pad = (4 - js.length % 4) % 4; const j2 = new Uint8Array(js.length + pad).fill(32); j2.set(js);
  const rest = new Uint8Array(ab, 20 + jl); const out = new Uint8Array(20 + j2.length + rest.length); const o = new DataView(out.buffer);
  o.setUint32(0, 0x46546c67, true); o.setUint32(4, 2, true); o.setUint32(8, out.length, true); o.setUint32(12, j2.length, true); o.setUint32(16, 0x4e4f534a, true); out.set(j2, 20); out.set(rest, 20 + j2.length); return out.buffer; }
const ab = await (await fetch(body.url)).arrayBuffer();
const gltf = await new Promise((r, j) => new GLTFLoader().parse(strip(ab), "", r, j));
const clip = (n) => gltf.animations.find((a) => a.name === n);
const SPEC = { walkSpeed: body.walkSpeed, runSpeed: body.run.speed, walkDuration: clip("Walk").duration, runDuration: clip("Run").duration };
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); renderer.setSize(1400, 760); renderer.setPixelRatio(1); document.body.appendChild(renderer.domElement);
const sc = new THREE.Scene(); sc.background = new THREE.Color("#dfe6ea"); sc.add(new THREE.HemisphereLight("#fff", "#889", 2.2)); const dl = new THREE.DirectionalLight("#fff", 1.5); dl.position.set(3, 4, 2); sc.add(dl);
const floor = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.2, 40), new THREE.MeshBasicMaterial({ color: "#4a5a3c" })); floor.position.set(-0.3, -0.1, 0); sc.add(floor);
for (let c = 1; c <= 8; c++) { const l = new THREE.Mesh(new THREE.BoxGeometry(0.01, 0.0015, 40), new THREE.MeshBasicMaterial({ color: "#999" })); l.position.set(0.3, c * 0.01, 0); if (c % 2 === 0) sc.add(l); }
const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0.3, 0.0005, -2), new THREE.Vector3(0.3, 0.0005, 12)]), new THREE.LineBasicMaterial({ color: "#c00" })); sc.add(line);
const spacing = 0.75, g = gaitTargets(v, SPEC), moving = g.walk + g.run, rm = moving ? g.run / moving : 0, rate = cycleRateFor(v, rm, SPEC), period = 1 / rate;
const info = []; const dt = 1 / 60;
for (let k = 0; k < N; k++) {
  const scene = skClone(gltf.scene); for (const m of [scene]) m.traverse((o) => { if (o.isMesh) { o.material = new THREE.MeshLambertMaterial({ color: o.name === "Shoes" ? "#333" : "#c9a27e" }); o.frustumCulled = false; } });
  scene.updateMatrixWorld(true); const lift = -new THREE.Box3().setFromObject(scene).min.y;
  const grp = new THREE.Group(); grp.add(scene); scene.position.y = lift;
  let hips; scene.traverse((o) => { if (!hips && o.name.endsWith("Hips")) hips = o; });
  const parent = hips.parent, hipsRest = hips.position.clone(), parentRest = parent.position.clone(), pq = parent.quaternion.clone();
  const rw = new THREE.Vector3(); grp.updateMatrixWorld(true); hips.getWorldPosition(rw); const restHipsY = rw.y;
  const pts = contactPoints(scene), runMin = clipMinClearance(scene, clip("Run"), pts);
  const mixer = new THREE.AnimationMixer(scene); const walk = mixer.clipAction(clip("Walk")), run = mixer.clipAction(clip("Run")), idle = mixer.clipAction(clip(new URLSearchParams(location.search).get("idle") ?? "IdleLong"));
  for (const a of [walk, run, idle]) a.play();
  walk.setEffectiveWeight(moving * (1 - rm)); run.setEffectiveWeight(moving * rm); idle.setEffectiveWeight(1 - moving);
  walk.timeScale = rate * SPEC.walkDuration; run.timeScale = rate * SPEC.runDuration;
  const T = 2 + (k / N) * period; const d = new THREE.Vector3(), hw = new THREE.Vector3();
  for (let t = 0; t < T; t += dt) { run.time = ((((walk.time / SPEC.walkDuration + body.run.phaseOffset) % 1) + 1) % 1) * SPEC.runDuration; mixer.update(dt); }
  if (mode === "after") rootMotionDelta(hips.position, hipsRest, parent.scale, pq, d); else { d.copy(hips.position).sub(hipsRest).applyQuaternion(pq); d.y = 0; }
  parent.position.copy(parentRest).sub(d);
  grp.position.set(0, 0, k * spacing); grp.updateMatrixWorld(true);
  if (mode === "after") { grp.position.y = -groundingOffset(soleClearance(pts, scene), runMin, moving * rm); }
  else { hips.getWorldPosition(hw); const dy = grp.worldToLocal(hw).y - restHipsY; grp.position.y = -verticalExcess(dy, 0.09) - body.run.footLift * moving * rm; }
  sc.add(grp); grp.updateMatrixWorld(true);
  const lo = new THREE.Vector3(); let min = 1e9; scene.traverse((o) => { if (o.isSkinnedMesh) { const p = o.geometry.attributes.position; for (let i = 0; i < p.count; i += 2) { o.getVertexPosition(i, lo); o.localToWorld(lo); if (lo.y < min) min = lo.y; } } });
  info.push(min);
}
const mid = ((N - 1) * spacing) / 2, w = mid + 0.6;
renderer.setScissorTest(true);
const view = (top, h, y0, y1) => { const cam = new THREE.OrthographicCamera(-w, w, (y1 - y0) / 2, -(y1 - y0) / 2, 0.1, 50); const cy = (y0 + y1) / 2; cam.position.set(6, cy, mid); cam.lookAt(0, cy, mid);
  cam.left = -w; cam.right = w; const half = (w * h) / 1400; cam.top = half; cam.bottom = -half; cam.updateProjectionMatrix(); renderer.setViewport(0, 760 - top - h, 1400, h); renderer.setScissor(0, 760 - top - h, 1400, h); renderer.render(sc, cam); };
view(0, 520, -0.12, 1.4);
// feet zoom: same width in z would be too wide, so zoom 3x on the left 3 frames is not shown; instead a full-width strip at 3x vertical scale is not possible with ortho -> render a tighter x-span of the floor band
// Feet zoom: a second row showing only y -0.04..0.18 at the same z span, stretched 2.3x vertically is not
// physical, so instead render the 4 first frames at higher zoom.
{ const h = 240, zs = 3 * spacing + 0.5, half = (zs * h) / 1400; const cam = new THREE.OrthographicCamera(-zs, zs, half, -half, 0.1, 50);
  const cz = 1.5 * spacing; cam.position.set(6, half - 0.05, cz); cam.lookAt(0, half - 0.05, cz); cam.updateProjectionMatrix();
  renderer.setViewport(0, 0, 1400, h); renderer.setScissor(0, 0, 1400, h); renderer.render(sc, cam); }
const lbl = document.createElement("div"); lbl.style.cssText = "position:absolute;top:6px;left:8px;font:16px monospace;background:#fffc;padding:3px 6px";
lbl.textContent = `${body.id} ${mode.toUpperCase()} v=${v} m/s  lowest vertex per frame (cm): ` + info.map((m) => (m * 100).toFixed(1)).join("  "); document.body.appendChild(lbl);
window.__done = true;
</script></body></html>
