services:
  - type: web
    name: aiverse-gateway
    runtime: docker
    dockerfilePath: ./apps/gateway/Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /health
    # This service has not been confirmed Blueprint-synced — NODE_ENV below
    # sat unset on prod for over a day despite being declared here with a
    # literal value (found + fixed 2026-09-03). Treat every var in this
    # block as documentation of required config, not a guarantee it's
    # actually applied; verify live state (GET /version, /health) after any
    # change rather than trusting this file alone.
    envVars:
      - key: DATABASE_URL
        sync: false
        # When switching this to the Neon POOLED connection string (hostname
        # contains "-pooler"), ALSO set DATABASE_URL_DIRECT to the current
        # direct URL — migrations and the single-gateway advisory lock run
        # on the direct connection (session state can't survive a
        # transaction-mode pooler). The gateway auto-disables prepared
        # statements on pooled URLs (db/client.ts).
      - key: DATABASE_URL_DIRECT
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: aiverse-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 3000
      - key: PUBLIC_BASE_URL
        sync: false
      - key: CONSOLE_ORIGINS
        sync: false
      - key: NODE_ENV
        value: production
      - key: OPENROUTER_API_KEY
        sync: false
      # Telemetry Phase 1: Sentry error capture for the gateway. Inert
      # (zero behavior change) until a DSN is set here; the release tag
      # is RENDER_GIT_COMMIT, which Render already injects.
      - key: SENTRY_DSN
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: AIVERSE_DISABLE_NATIVES
        sync: false
      # Owner email verification is enforced by default in production, and
      # the gateway refuses to boot without RESEND_API_KEY while it is.
      # EMAIL_FROM's domain must be verified in Resend.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: REQUIRE_EMAIL_VERIFICATION
        sync: false
      # Agent world body (/world/*). Mounts only when all three are set and
      # the secret is >= 32 chars; otherwise the routes stay 404 and the
      # agent card carries no x-aiverse-world. Unset AIVERSE_WORLD_MODE to
      # roll back (bodies live in sim memory only, nothing to undo).
      - key: AIVERSE_WORLD_MODE
        value: "1"
      - key: SIM_URL
        value: http://aiverse-sim:3020
      - key: SIM_INTERNAL_SECRET
        fromService:
          type: pserv
          name: aiverse-sim
          envVarKey: SIM_INTERNAL_SECRET

  # City 3 simulation: private (no public URL), reached by the gateway over
  # Render's private network. Single process, in-memory bodies; a restart
  # drops them and agents re-attach. Same region as the gateway (default).
  - type: pserv
    name: aiverse-sim
    runtime: docker
    dockerfilePath: ./apps/sim/Dockerfile
    dockerContext: .
    plan: starter
    envVars:
      - key: SIM_INTERNAL_SECRET
        generateValue: true

  - type: keyvalue
    name: aiverse-redis
    plan: free
    ipAllowList: []
