name: Deploy Verify

# Post-merge deploy assertion. AGENTS.md rules 13/14 exist because stale
# deploys shipped silently twice: the build was green, /health answered 200
# on the OLD instance, and prod ran an old commit for ~2 days. Render and
# Vercel both autodeploy on push to main, but nothing checked that the
# merged commit actually became the live one. This workflow is that check:
# after every push to main it polls until both production surfaces provably
# serve ${GITHUB_SHA}, and fails loudly when they don't.
#
# Gateway half: GET api.aiverse.network/version is public and returns the
# running build's gitSha — an exact, self-reported assertion.
#
# Console half: no Vercel token is available to Actions (the repo carries
# no secrets, and none should be added for a read-only check), so this uses
# the deployment_status surface Vercel's GitHub integration already
# publishes: a Production GitHub Deployment keyed to the exact commit SHA,
# created by vercel[bot]. Known semantic caveat (verified 2026-11-10 on
# main a6645e87): Vercel posted the deployment's "success" status ~1s after
# creating it, i.e. the status means "deployment accepted" more than "build
# finished and aliased". The deployment's existence for this exact SHA plus
# the live-site smoke check below is the strongest signal available without
# a token; if Vercel ever stops registering GitHub deployments, this job
# fails loudly instead of going silently blind — which is the point.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: read

concurrency:
  group: deploy-verify-${{ github.sha }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Gateway serves the merged SHA (/version)
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -u
          deadline=$(( $(date +%s) + 600 ))
          while :; do
            body="$(curl -sf --max-time 15 https://api.aiverse.network/version || true)"
            sha="$(printf '%s' "$body" | jq -r '.gitSha // empty' 2>/dev/null || true)"
            if [ "$sha" = "$EXPECTED_SHA" ]; then
              echo "gateway OK: /version gitSha == $EXPECTED_SHA"
              break
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::gateway deploy assertion FAILED: /version reports '${sha:-unreachable}', expected $EXPECTED_SHA after 10 min. The merged commit is NOT live on Render — stale deploy (AGENTS.md rules 13/14)."
              exit 1
            fi
            echo "gateway at '${sha:-unreachable}', waiting for $EXPECTED_SHA ..."
            sleep 20
          done

      - name: Console deployment for the merged SHA succeeds (Vercel via GitHub Deployments)
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -u
          deadline=$(( $(date +%s) + 600 ))
          dep_id=""
          while :; do
            dep_id="$(gh api "repos/$REPO/deployments?sha=$EXPECTED_SHA&environment=Production&per_page=10" \
              --jq '[.[] | select(.creator.login == "vercel[bot]")] | .[0].id // empty' 2>/dev/null || true)"
            if [ -n "$dep_id" ]; then
              break
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::console deploy assertion FAILED: no Vercel Production deployment registered for $EXPECTED_SHA after 10 min."
              exit 1
            fi
            echo "no Vercel deployment for $EXPECTED_SHA yet ..."
            sleep 20
          done
          echo "Vercel deployment id: $dep_id"
          deadline=$(( $(date +%s) + 600 ))
          while :; do
            state="$(gh api "repos/$REPO/deployments/$dep_id/statuses?per_page=5" \
              --jq '.[0].state // empty' 2>/dev/null || true)"
            case "$state" in
              success)
                echo "console OK: Vercel deployment $dep_id reports success"
                break
                ;;
              failure|error)
                echo "::error::console deploy assertion FAILED: Vercel deployment $dep_id state=$state."
                exit 1
                ;;
            esac
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::console deploy assertion FAILED: Vercel deployment $dep_id stuck in state '${state:-none}' after 10 min."
              exit 1
            fi
            echo "Vercel deployment $dep_id state '${state:-none}', waiting ..."
            sleep 20
          done

      - name: Live smoke (console + gateway health)
        run: |
          curl -sf --max-time 15 -o /dev/null https://aiverse.network/ \
            || { echo "::error::console smoke FAILED: https://aiverse.network/ not 200"; exit 1; }
          curl -sf --max-time 15 -o /dev/null https://api.aiverse.network/health \
            || { echo "::error::gateway smoke FAILED: https://api.aiverse.network/health not 200"; exit 1; }
          echo "smoke OK: console and gateway live"
